<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MDSeeker</title>
    <style>
      /* Prevent white flash during native WebView2 initialization and theme hydration */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #202020;
        color: #ffffff;
      }
      html[data-theme="light"], html.light {
        background-color: #f3f3f3;
        color: #1b1b1b;
      }
    </style>
    <script>
      // Synchronous pre-hydration theme setup to prevent color flicker
      (function() {
        try {
          var saved = localStorage.getItem('mdseeker-theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || ((!saved || saved === 'system') && prefersDark);
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.classList.remove('light');
            root.setAttribute('data-theme', saved || 'system');
            root.style.backgroundColor = '#202020';
          } else {
            root.classList.remove('dark');
            root.classList.add('light');
            root.setAttribute('data-theme', saved || 'light');
            root.style.backgroundColor = '#f3f3f3';
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
